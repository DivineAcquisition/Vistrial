<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>A sign-in method was linked</title>
  </head>
  <body style="margin:0;padding:0;width:100%;background-color:#f3f1f8;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">
      Your {{ .Provider }} account was linked for {{ .Email }}.&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#f3f1f8" style="background-color:#f3f1f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1c1b22;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
            <tr>
              <td bgcolor="#ffffff" style="background-color:#ffffff;border:1px solid #e3e0ec;border-radius:16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td height="3" bgcolor="#9a88fc" style="height:3px;background-color:#9a88fc;font-size:0;line-height:0;">&#8203;</td>
                  </tr>
                </table>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding:28px 32px 32px;">
                      <a href="{{ .SiteURL }}" style="text-decoration:none;">
                        <img src="https://app.vistrial.io/brand/vistrial-lockup-ink.png" width="116" height="32" alt="Vistrial" style="display:block;border:0;outline:none;text-decoration:none;width:116px;height:32px;" />
                      </a>
                      <h1 style="margin:28px 0 16px;font-size:26px;line-height:34px;font-weight:600;letter-spacing:-0.4px;color:#1c1b22;">A sign-in method was linked</h1>
                      <p style="margin:0 0 16px;font-size:16px;line-height:26px;color:#52525b;">Your {{ .Provider }} account was linked for {{ .Email }}.</p>
                      
                      
                      
                      <p style="margin:24px 0 0;font-size:14px;line-height:22px;color:#6f6c7b;">If you didn't make this change, contact us.</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 8px 0;font-size:12px;line-height:18px;color:#6f6c7b;">
                Vistrial<br />
                Need a hand? <a href="mailto:contact@vistrial.io" style="color:#1c1b22;text-decoration:underline;">Contact us</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
