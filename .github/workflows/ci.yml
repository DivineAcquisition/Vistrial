name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # Anything that ships to a user has to be clean. Dev-only tooling is
      # reported below rather than blocking, because an advisory there can
      # outlive every published fix for it.
      - name: Dependency vulnerabilities, production (high and critical block)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency vulnerabilities, dev tooling (report only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: No secrets in the client bundle
        run: node scripts/assert-no-secrets-in-client.mjs
